<!doctype html>
<html>
<head><title>RAB Community Login</title>
<style>
    body { font-family: sans-serif; background: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 100px; border-radius: 12px; box-shadow: 0 4px 15px rgba(7, 139, 29, 0.1); width: 300px; text-align: center; }
    h2 { color: #0d1f46; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #d446a5; border-radius: 5px; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #ffe500; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .flash { padding: 10px; margin-bottom: 10px; border-radius: 5px; font-size: 14px; }
    .danger { background: #fdeceb; color: #dc3545; }
</style>
</head>
<body>
    <div class="card">
      
        <h2>RAB Community</h2>

        <img src="{{ url_for('static', filename='Modern RAB Rent A Bike Office.png') }}" 
        alt="RAB" style="height:200px; width:310px; margin-bottom:10px;"> 

        <p style="color:#667085;">Staff & Admin Login</p>
        
        {% with msgs = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in msgs %}
                <div class="flash {{ cat }}">{{ msg }}</div>
            {% endfor %}
        {% endwith %}
        
        <form method="post">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
